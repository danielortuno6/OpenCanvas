<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14151b"><title>OpenCanvas · Free Painting Studio</title><style>
:root{color-scheme:dark;--bg:#14151b;--panel:#20212b;--line:#373946;--text:#f4f4f7;--muted:#a3a5b6;--accent:#ab86ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,select{font:inherit}button{background:#323442;color:var(--text);border:1px solid #444655;border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{background:#424454}button.active{background:#694ba4;border-color:#ad8ef1}button:disabled{opacity:.35}.app{height:100dvh;display:flex;flex-direction:column}header{height:56px;display:flex;align-items:center;gap:9px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}header strong{font-size:18px;letter-spacing:-.6px;margin-right:8px}header .right{margin-left:auto;display:flex;gap:7px}.workspace{flex:1;min-height:0;display:flex}.tools,.layers{background:var(--panel);padding:14px;overflow:auto}.tools{width:230px;border-right:1px solid var(--line)}.layers{width:250px;border-left:1px solid var(--line)}.tools label,.layers label{display:block;font-size:12px;color:var(--muted);margin:15px 0 5px}.tools input[type=range],.layers input[type=range]{width:100%;accent-color:var(--accent)}.toolgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.toolgrid button{font-size:13px}input[type=color]{width:100%;height:44px;background:none;border:0;cursor:pointer}.stage{flex:1;min-width:0;min-height:0;overflow:hidden;position:relative;display:grid;place-items:center;background-color:#282a34;background-image:radial-gradient(#424450 1px,transparent 1px);background-size:24px 24px;touch-action:none}.sheet{position:absolute;width:1024px;height:768px;transform-origin:center;box-shadow:0 18px 70px #0008;background:white;touch-action:none}.sheet canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.layerrow{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid #444655;border-radius:10px;margin:8px 0;cursor:pointer}.layerrow.selected{border-color:var(--accent);background:#343046}.layerrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.layerrow input{accent-color:var(--accent)}.layer-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.hint{font-size:12px;color:var(--muted);line-height:1.5}footer{height:28px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--muted);padding:6px 14px;display:flex;justify-content:space-between}.rangehead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.badge{background:#494052;color:#dccaff;font-size:11px;border-radius:20px;padding:4px 8px}.hide-sm{display:inline}.divider{border-top:1px solid var(--line);margin-top:16px}.mobiletabs{display:none}@media(max-width:850px){header{height:52px;padding:6px;gap:5px}header strong{font-size:14px;margin:0 4px}header button{padding:8px;font-size:12px}.hide-sm{display:none}.tools,.layers{position:absolute;z-index:4;top:52px;bottom:55px;box-shadow:0 10px 20px #0008}.tools{left:0;transform:translateX(-110%)}.layers{right:0;transform:translateX(110%)}.tools.show,.layers.show{transform:none}.mobiletabs{display:flex;position:absolute;bottom:28px;left:0;right:0;z-index:5;justify-content:space-around;padding:7px;background:var(--panel);border-top:1px solid var(--line)}.mobiletabs button{font-size:12px}footer{height:28px}.workspace{position:relative}}
</style></head><body><div class="app"><header><strong>◈ OpenCanvas</strong><span class="badge hide-sm">Free Studio</span><button id="undo" title="Undo (Ctrl/⌘ Z)">↶</button><button id="redo" title="Redo (Ctrl/⌘ Shift Z)">↷</button><button id="fit">Fit</button><button id="clear" class="hide-sm">Clear Layer</button><div class="right"><button id="new" class="hide-sm">New</button><button id="open">Open</button><button id="save">Save</button><button id="export">Export PNG</button></div></header><div class="workspace"><aside class="tools" id="tools"><b>Brush Studio</b><label>Tool</label><div class="toolgrid"><button data-tool="brush" class="active">✎ Brush</button><button data-tool="eraser">◌ Eraser</button><button data-tool="hand">✋ Pan</button><button data-tool="eyedrop">◉ Picker</button></div><label>Brush style</label><div class="toolgrid"><button data-brush="round" class="active">Round</button><button data-brush="soft">Airbrush</button><button data-brush="marker">Marker</button><button data-brush="pencil">Pencil</button></div><label>Color</label><input id="color" type="color" value="#7556e9"><div class="rangehead"><span>Size</span><span id="sizeVal">18 px</span></div><input id="size" type="range" min="1" max="150" value="18"><div class="rangehead"><span>Opacity</span><span id="alphaVal">100%</span></div><input id="alpha" type="range" min="1" max="100" value="100"><div class="divider"></div><label>Canvas zoom</label><input id="zoom" type="range" min="20" max="300" value="70"><p class="hint">Apple Pencil pressure changes stroke thickness. Two-finger pinch to zoom and move the canvas. On desktop, hold Space to pan.</p></aside><main class="stage" id="stage"><div class="sheet" id="sheet"></div></main><aside class="layers" id="layers"><b>Layers</b><p class="hint">Top layers cover lower layers. Tap to select.</p><div class="layer-actions"><button id="addLayer">＋ Add</button><button id="duplicate">Duplicate</button><button id="layerUp">↑ Raise</button><button id="layerDown">↓ Lower</button><button id="removeLayer">Delete</button><button id="renameLayer">Rename</button></div><div id="layerList"></div><label>Selected layer opacity</label><input type="range" min="0" max="100" value="100" id="layerOpacity"></aside><div class="mobiletabs"><button id="toggleTools">✎ Brushes</button><button id="toggleLayers">▤ Layers</button></div></div><footer><span id="status">Ready · 1024 × 768</span><span id="zoomText">70%</span></footer></div><input id="file" type="file" accept=".opencanvas,.json,image/*" hidden><script>
(()=>{'use strict';const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));const sheet=$('#sheet'),stage=$('#stage');let W=1024,H=768,layers=[],selected=0,tool='brush',brush='round',zoom=.7,offset={x:0,y:0},history=[],future=[],drawing=null,space=false,pointers=new Map(),gesture=null;const MAX_HISTORY=18;const newCanvas=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};function makeLayer(name){return {id:Date.now()+Math.random(),name,visible:true,opacity:1,canvas:newCanvas()}}function current(){return layers[selected]}function applyView(){sheet.style.width=W+'px';sheet.style.height=H+'px';sheet.style.transform=`translate(${offset.x}px,${offset.y}px) scale(${zoom})`;$('#zoomText').textContent=Math.round(zoom*100)+'%';$('#zoom').value=Math.round(zoom*100)}function mount(){sheet.innerHTML='';layers.forEach(l=>{l.canvas.style.opacity=l.opacity;l.canvas.style.display=l.visible?'block':'none';sheet.appendChild(l.canvas)});renderLayers()}function renderLayers(){$('#layerList').innerHTML='';for(let i=layers.length-1;i>=0;i--){const l=layers[i],row=document.createElement('div');row.className='layerrow'+(i===selected?' selected':'');const chk=document.createElement('input');chk.type='checkbox';chk.checked=l.visible;chk.title='Toggle layer visibility';chk.onchange=e=>{e.stopPropagation();snapshot();l.visible=chk.checked;mount()};const text=document.createElement('span');text.textContent=l.name;row.append(chk,text);row.onclick=()=>{selected=i;renderLayers()};$('#layerList').appendChild(row)}$('#layerOpacity').value=Math.round(current().opacity*100)}function status(s){$('#status').textContent=s}function snapshot(){history.push(JSON.stringify({selected,layers:layers.map(l=>({id:l.id,name:l.name,visible:l.visible,opacity:l.opacity,image:l.canvas.toDataURL('image/png')}))}));if(history.length>MAX_HISTORY)history.shift();future=[];updateHistory()}function updateHistory(){$('#undo').disabled=!history.length;$('#redo').disabled=!future.length}function capture(){return JSON.stringify({selected,layers:layers.map(l=>({id:l.id,name:l.name,visible:l.visible,opacity:l.opacity,image:l.canvas.toDataURL('image/png')}))})}async function restore(json){let d=JSON.parse(json);layers=await Promise.all(d.layers.map(async a=>{const l=makeLayer(a.name);l.id=a.id;l.visible=a.visible;l.opacity=a.opacity;await drawDataUrl(l.canvas,a.image);return l}));selected=Math.min(d.selected,layers.length-1);mount()}function drawDataUrl(c,url){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{c.getContext('2d').clearRect(0,0,c.width,c.height);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve()};im.onerror=reject;im.src=url})}async function undo(){if(!history.length)return;future.push(capture());await restore(history.pop());updateHistory()}async function redo(){if(!future.length)return;history.push(capture());await restore(future.pop());updateHistory()}
function point(e){const rect=sheet.getBoundingClientRect();return{x:(e.clientX-rect.left)/zoom,y:(e.clientY-rect.top)/zoom}}function hexRgb(s){return [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)]}function stamp(p,pressure){const l=current();if(!l.visible)return;const ctx=l.canvas.getContext('2d'),r=+$('#size').value*Math.max(.22,pressure||.5)/2,a=+$('#alpha').value/100;ctx.save();ctx.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';const color=$('#color').value;if(brush==='soft'&&tool!=='eraser'){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*2);const [red,green,blue]=hexRgb(color);g.addColorStop(0,`rgba(${red},${green},${blue},${a*.18})`);g.addColorStop(1,`rgba(${red},${green},${blue},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*2,0,Math.PI*2);ctx.fill()}else{ctx.globalAlpha=a*(brush==='marker'?.4:brush==='pencil'?.65:1);ctx.fillStyle=tool==='eraser'?'#000':color;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.4,r),0,Math.PI*2);ctx.fill()}ctx.restore()}
function strokeTo(p,pressure){if(!drawing)return;const from=drawing.last,dist=Math.hypot(p.x-from.x,p.y-from.y),step=Math.max(.5,+$('#size').value*.09),n=Math.max(1,Math.ceil(dist/step));for(let j=1;j<=n;j++){const t=j/n;stamp({x:from.x+(p.x-from.x)*t,y:from.y+(p.y-from.y)*t},pressure)}drawing.last=p}
function pinchState(){const a=[...pointers.values()];if(a.length<2)return null;return {cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2,d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)}}stage.addEventListener('pointerdown',e=>{e.preventDefault();stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){drawing=null;const p=pinchState();gesture={...p,zoom,offset:{...offset}};return}if(tool==='hand'||space||e.button===1){drawing={mode:'pan',x:e.clientX,y:e.clientY,offset:{...offset}};return}const p=point(e);if(tool==='eyedrop'){const tmp=newCanvas(),ctx=tmp.getContext('2d');layers.forEach(l=>{if(l.visible){ctx.globalAlpha=l.opacity;ctx.drawImage(l.canvas,0,0)}});const rgba=ctx.getImageData(Math.max(0,Math.min(W-1,Math.floor(p.x))),Math.max(0,Math.min(H-1,Math.floor(p.y))),1,1).data;$('#color').value='#'+[...rgba].slice(0,3).map(v=>v.toString(16).padStart(2,'0')).join('');return}if(e.button!==0)return;snapshot();drawing={mode:'draw',last:p};stamp(p,e.pointerType==='pen'?e.pressure||.5:1)});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2&&gesture){const p=pinchState(),ratio=p.d/gesture.d;zoom=Math.max(.2,Math.min(3,gesture.zoom*ratio));offset.x=gesture.offset.x+p.cx-gesture.cx;offset.y=gesture.offset.y+p.cy-gesture.cy;applyView();return}if(!drawing)return;if(drawing.mode==='pan'){offset.x=drawing.offset.x+e.clientX-drawing.x;offset.y=drawing.offset.y+e.clientY-drawing.y;applyView()}else if(drawing.mode==='draw'){const events=e.getCoalescedEvents?e.getCoalescedEvents():[e];events.forEach(ev=>strokeTo(point(ev),ev.pointerType==='pen'?ev.pressure||.5:1))}});function end(e){pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(drawing?.mode==='draw')status('Stroke added · '+W+' × '+H);drawing=null}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);stage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.2,Math.min(3,zoom*(e.deltaY>0?.92:1.08)));applyView()},{passive:false});
$$('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$$('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});$$('[data-brush]').forEach(b=>b.onclick=()=>{brush=b.dataset.brush;$$('[data-brush]').forEach(x=>x.classList.toggle('active',x===b))});$('#size').oninput=e=>$('#sizeVal').textContent=e.target.value+' px';$('#alpha').oninput=e=>$('#alphaVal').textContent=e.target.value+'%';$('#zoom').oninput=e=>{zoom=+e.target.value/100;applyView()};$('#fit').onclick=()=>{zoom=Math.min((stage.clientWidth-55)/W,(stage.clientHeight-55)/H,1);offset={x:0,y:0};applyView()};$('#addLayer').onclick=()=>{snapshot();layers.splice(selected+1,0,makeLayer('Layer '+(layers.length+1)));selected++;mount()};$('#duplicate').onclick=()=>{snapshot();const a=current(),l=makeLayer(a.name+' copy');l.canvas.getContext('2d').drawImage(a.canvas,0,0);layers.splice(selected+1,0,l);selected++;mount()};$('#removeLayer').onclick=()=>{if(layers.length===1){alert('Keep at least one layer');return}snapshot();layers.splice(selected,1);selected=Math.min(selected,layers.length-1);mount()};$('#layerUp').onclick=()=>{if(selected>=layers.length-1)return;snapshot();[layers[selected],layers[selected+1]]=[layers[selected+1],layers[selected]];selected++;mount()};$('#layerDown').onclick=()=>{if(selected===0)return;snapshot();[layers[selected],layers[selected-1]]=[layers[selected-1],layers[selected]];selected--;mount()};$('#renameLayer').onclick=()=>{const n=prompt('Layer name',current().name);if(n){snapshot();current().name=n;renderLayers()}};$('#layerOpacity').onchange=e=>{snapshot();current().opacity=+e.target.value/100;mount()};$('#clear').onclick=()=>{snapshot();current().canvas.getContext('2d').clearRect(0,0,W,H)};$('#undo').onclick=undo;$('#redo').onclick=redo;$('#new').onclick=()=>{if(!confirm('Create a new blank canvas? Export or save first to keep your art.'))return;W=1024;H=768;layers=[makeLayer('Sketch')];selected=0;history=[];future=[];mount();$('#fit').click();updateHistory()};
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}function composite(){const c=newCanvas(),ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);layers.forEach(l=>{if(l.visible){ctx.globalAlpha=l.opacity;ctx.drawImage(l.canvas,0,0)}});return c}$('#export').onclick=()=>download(composite().toDataURL('image/png'),'opencanvas-artwork.png');$('#save').onclick=()=>{const file={format:'opencanvas',version:1,width:W,height:H,...JSON.parse(capture())};const url=URL.createObjectURL(new Blob([JSON.stringify(file)],{type:'application/json'}));download(url,'my-artwork.opencanvas');setTimeout(()=>URL.revokeObjectURL(url),60000)};$('#open').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.type.startsWith('image/')){const url=URL.createObjectURL(f);snapshot();await drawDataUrl(current().canvas,url);URL.revokeObjectURL(url);mount()}else{const d=JSON.parse(await f.text());if(d.format!=='opencanvas')throw Error('Not an OpenCanvas project');W=d.width;H=d.height;sheet.style.width=W+'px';sheet.style.height=H+'px';history=[];future=[];await restore(JSON.stringify(d));$('#fit').click();updateHistory()}status('Opened '+f.name)}catch(err){alert('Could not open file: '+err.message)}e.target.value=''};$('#toggleTools').onclick=()=>{$('#tools').classList.toggle('show');$('#layers').classList.remove('show')};$('#toggleLayers').onclick=()=>{$('#layers').classList.toggle('show');$('#tools').classList.remove('show')};window.addEventListener('keydown',e=>{if(e.code==='Space'){space=true;e.preventDefault()}if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();e.shiftKey?redo():undo()}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();$('#save').click()}});window.addEventListener('keyup',e=>{if(e.code==='Space')space=false});layers=[makeLayer('Sketch')];mount();$('#fit').click();updateHistory();})();
</script></body></html>
